backend:
  name: github
  repo: vandeshlin-del/pedex-website
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "content"
    label: "Website Content"
    format: "json"
    files:
      - name: "site"
        label: "General Content"
        file: "site.json"
        fields:
          - label: "Hero — Eyebrow"
            name: "hero.eyebrow"
            widget: "string"
          - label: "Hero — Title Line 1"
            name: "hero.title1"
            widget: "string"
          - label: "Hero — Title Line 2"
            name: "hero.title2"
            widget: "string"
          - label: "Hero — Subtitle"
            name: "hero.subtitle"
            widget: "text"
          - label: "Stats (numbers shown on home)"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Scrolling product strip"
            name: "marquee"
            widget: "list"
            fields:
              - { label: "Image", name: "img", widget: "image" }
              - { label: "Title", name: "label", widget: "string" }
              - { label: "Subtitle", name: "sub", widget: "string" }
          - label: "Home cards (4 categories)"
            name: "homeCards"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "About — Title"
            name: "about.title"
            widget: "string"
          - label: "About — Text"
            name: "about.text"
            widget: "text"
          - label: "About — Bullet points"
            name: "about.points"
            widget: "list"
          - label: "About — Mission"
            name: "about.mission"
            widget: "text"
          - label: "About — Approach"
            name: "about.approach"
            widget: "text"
          - label: "About — Markets"
            name: "about.markets"
            widget: "text"
          - label: "Products — Optical Division"
            name: "productsOptical"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Products — Valve Division"
            name: "productsValve"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "News items"
            name: "news"
            widget: "list"
            fields:
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Contact — Email"
            name: "contact.email"
            widget: "string"
          - label: "Contact — Phone"
            name: "contact.phone"
            widget: "string"
          - label: "Contact — WhatsApp"
            name: "contact.whatsapp"
            widget: "string"
          - label: "Contact — Address"
            name: "contact.address"
            widget: "text"
          - label: "Contact — Business Hours"
            name: "contact.hours"
            widget: "string"
